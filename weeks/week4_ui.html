<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏠 Property Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f0f2f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-container {
      width: 100%;
      max-width: 720px;
      height: 90vh;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      background: #3C3489;
      color: white;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-header .avatar {
      width: 40px;
      height: 40px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .chat-header .info h2 {
      font-size: 16px;
      font-weight: 600;
    }

    .chat-header .info p {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #1D9E75;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 10px;
      max-width: 85%;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.agent .bubble {
      background: #f0f2f5;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
    }

    .message.user .bubble {
      background: #3C3489;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message .msg-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .message.agent .msg-avatar { background: #EEEDFE; }
    .message.user  .msg-avatar { background: #E1F5EE; }

    .typing-indicator {
      display: flex;
      gap: 4px;
      padding: 12px 16px;
      background: #f0f2f5;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .typing-indicator span {
      width: 7px;
      height: 7px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30%            { transform: translateY(-6px); }
    }

    .input-area {
      padding: 16px 24px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-area textarea {
      flex: 1;
      border: 1.5px solid #e0e0e0;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 120px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }

    .input-area textarea:focus {
      border-color: #3C3489;
    }

    .send-btn {
      width: 44px;
      height: 44px;
      background: #3C3489;
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover    { background: #2d2570; }
    .send-btn:disabled { background: #ccc; cursor: not-allowed; }

    /* Markdown-like formatting */
    .bubble strong { font-weight: 600; }
    .bubble em     { font-style: italic; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">🏠</div>
    <div class="info">
      <h2>Property Assistant</h2>
      <p><span class="status-dot"></span>Online — here to help</p>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <textarea
      id="input"
      placeholder="Type your message..."
      rows="1"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
  // Generate unique session ID per browser tab
  const threadId = "user_" + Math.random().toString(36).substr(2, 9);
  let isStreaming = false;

  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("input");
  const sendBtn    = document.getElementById("sendBtn");

  // Auto-resize textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = inputEl.scrollHeight + "px";
  });

  // Send on Enter (Shift+Enter for new line)
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function addMessage(role, text) {
    const div = document.createElement("div");
    div.className = `message ${role}`;
    div.innerHTML = `
      <div class="msg-avatar">${role === "agent" ? "🏠" : "👤"}</div>
      <div class="bubble">${formatText(text)}</div>
    `;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div.querySelector(".bubble");
  }

  function addTypingIndicator() {
    const div = document.createElement("div");
    div.className = "message agent";
    div.id = "typing";
    div.innerHTML = `
      <div class="msg-avatar">🏠</div>
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    `;
    messagesEl.appendChild(div);
    scrollToBottom();
    return div;
  }

  function formatText(text) {
  return text
    .replace(/^(applicant|resident|unknown)\s*/i, "") // remove state leaks
    .replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>")
    .replace(/\*(.*?)\*/g, "<em>$1</em>")
    .replace(/\n/g, "<br>");
}

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isStreaming) return;

    // Show user message
    addMessage("user", text);
    inputEl.value = "";
    inputEl.style.height = "auto";
    isStreaming = true;
    sendBtn.disabled = true;

    // Show typing indicator
    const typing = addTypingIndicator();
    let agentBubble = null;
    let fullText    = "";

    try {
      const response = await fetch("/api/v1/chat/stream", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ message: text, thread_id: threadId })
      });

      const reader  = response.body.getReader();
      const decoder = new TextDecoder();

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        const lines = decoder.decode(value).split("\n");
        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const data = JSON.parse(line.slice(6));

          if (data.done) break;
          if (data.error) {
            console.error("Stream error:", data.error);
            break;
          }

          if (data.text) {
            // Remove typing indicator and create agent bubble on first chunk
            if (!agentBubble) {
              typing.remove();
              agentBubble = addMessage("agent", "");
            }
            fullText += data.text;
            agentBubble.innerHTML = formatText(fullText);
            scrollToBottom();
          }
        }
      }

    } catch (err) {
      console.error("Error:", err);
      typing.remove();
      addMessage("agent", "Sorry, something went wrong. Please try again.");
    }

    isStreaming   = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }

  // Send initial greeting
  window.onload = () => {
    inputEl.focus();
    // Auto-trigger welcome message
    setTimeout(async () => {
      const typing = addTypingIndicator();
      let agentBubble = null;
      let fullText    = "";

      try {
        const response = await fetch("/api/v1/chat/stream", {
          method:  "POST",
          headers: { "Content-Type": "application/json" },
          body:    JSON.stringify({ message: "hi", thread_id: threadId })
        });

        const reader  = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const lines = decoder.decode(value).split("\n");
          for (const line of lines) {
            if (!line.startsWith("data: ")) continue;
            const data = JSON.parse(line.slice(6));
            if (data.done || data.error) break;
            if (data.text) {
              if (!agentBubble) {
                typing.remove();
                agentBubble = addMessage("agent", "");
              }
              fullText += data.text;
              agentBubble.innerHTML = formatText(fullText);
              scrollToBottom();
            }
          }
        }
      } catch(e) {
        typing.remove();
      }
    }, 500);
  };
</script>

</body>
</html>
